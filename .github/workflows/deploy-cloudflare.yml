name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.outputs.outputs.web_url }}
    timeout-minutes: 30
    env:
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_workers_dev_subdomain: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      RELAY_HOSTNAME: ${{ vars.RELAY_HOSTNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract audio assets
        run: unzip -q packages/engine/src/assets/audio.zip -d packages/engine/src/assets

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Set up Doppler
        uses: dopplerhq/cli-action@v3

      - name: Validate deployment configuration
        shell: bash
        env:
          DOPPLER_WEB_TOKEN: ${{ secrets.DOPPLER_WEB_TOKEN }}
          DOPPLER_INFRA_TOKEN: ${{ secrets.DOPPLER_INFRA_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          required=(
            DOPPLER_WEB_TOKEN
            DOPPLER_INFRA_TOKEN
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            TF_STATE_BUCKET
            TF_VAR_cloudflare_account_id
            TF_VAR_workers_dev_subdomain
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub production environment value: ${name}"
              exit 1
            fi
          done

          if [[ -n "${CLOUDFLARE_ZONE_ID}" && -z "${RELAY_HOSTNAME}" ]] ||
            [[ -z "${CLOUDFLARE_ZONE_ID}" && -n "${RELAY_HOSTNAME}" ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID and RELAY_HOSTNAME must be set together"
            exit 1
          fi

          if [[ -n "${CLOUDFLARE_ZONE_ID}" ]]; then
            echo "TF_VAR_cloudflare_zone_id=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
            echo "TF_VAR_relay_hostname=${RELAY_HOSTNAME}" >> "${GITHUB_ENV}"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build relay Worker
        run: bun run --cwd apps/server build

      - name: Build web application
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_WEB_TOKEN }}
        run: doppler run --project web --config prod -- bun run --cwd apps/web build

      - name: Initialize Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: terraform -chdir=infra/cloudflare init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate Terraform
        run: terraform -chdir=infra/cloudflare validate

      - name: Plan deployment
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_INFRA_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: doppler run --project infra --config prod -- terraform -chdir=infra/cloudflare plan -out=deploy.tfplan

      - name: Apply deployment
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_INFRA_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: doppler run --project infra --config prod -- terraform -chdir=infra/cloudflare apply -auto-approve deploy.tfplan

      - name: Read deployment URLs
        id: outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          echo "web_url=$(terraform -chdir=infra/cloudflare output -raw web_url)" >> "${GITHUB_OUTPUT}"
          echo "relay_url=$(terraform -chdir=infra/cloudflare output -raw relay_websocket_url)" >> "${GITHUB_OUTPUT}"

      - name: Add deployment summary
        env:
          WEB_URL: ${{ steps.outputs.outputs.web_url }}
          RELAY_URL: ${{ steps.outputs.outputs.relay_url }}
        run: |
          {
            echo "## Cloudflare deployment"
            echo
            echo "- Web: ${WEB_URL}"
            echo "- Relay: ${RELAY_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
